<title>המחברת</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>/* מחברת של צורף v4 — לוח של קופסאות לפי נושא, מסילות נגללות, ודפים שמדפדפים בהחלקה (קפיץ, בלי overshoot).
   נייר בון חם · זהב לחוצצים ולמוקד · כל נושא מקבל צבע-קבוצה אחד · סטטוסים כאבנים קטנות. */
:root{
  --paper:#f6f1e7; --page:#fffdf8; --page-2:#f0e9db; --rule:#e8dfcc; --line:#d9cfb9;
  --ink:#2b2622; --ink-2:#5a534b; --muted:#8a8174;
  --gold:#b08a2e; --gold-2:#d4b562; --gold-soft:#f4ead0;
  --blue:#4b5a9e; --blue-soft:#e3e6f3;
  --ok:#4f7d5a; --ok-soft:#e1ecdf; --warn:#a27a1e; --warn-soft:#f5ead0; --bad:#a9544c; --bad-soft:#f3dfdb;
  --office:#6d4c9a; --office-soft:#ebe3f4;
  --attn:#c2410c; --attn-soft:#fde7d9; --attn-ink:#fff;
  --g-remnant:#3b3530; --g-dr:#b08a2e; --g-cai:#2f7f7a; --g-trading:#4b5a9e; --g-projects:#6d4c9a; --g-personal:#b0645a; --g-infra:#8a8174;
  --glass:rgba(246,241,231,.78); --scrim:rgba(43,38,34,.38);
  --font:'Heebo',system-ui,sans-serif; --serif:'Frank Ruhl Libre',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1b1814; --page:#24201a; --page-2:#2d2820; --rule:#363027; --line:#4a4236;
  --ink:#efe8da; --ink-2:#c9c0b0; --muted:#958c7d;
  --gold:#d9bc6a; --gold-2:#e8d08a; --gold-soft:#3a3220;
  --blue:#9aa7e6; --blue-soft:#272b45;
  --ok:#8fc49a; --ok-soft:#223526; --warn:#e0b85c; --warn-soft:#3a3018; --bad:#ec9a90; --bad-soft:#402523;
  --office:#c7aef0; --office-soft:#2f2540;
  --attn:#ff9a62; --attn-soft:#432616; --attn-ink:#1b1814;
  --g-remnant:#d8cfc2; --g-dr:#d9bc6a; --g-cai:#6cc3bb; --g-trading:#9aa7e6; --g-projects:#c7aef0; --g-personal:#e39a8f; --g-infra:#a99f90;
  --glass:rgba(27,24,20,.78); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1b1814; --page:#24201a; --page-2:#2d2820; --rule:#363027; --line:#4a4236;
  --ink:#efe8da; --ink-2:#c9c0b0; --muted:#958c7d;
  --gold:#d9bc6a; --gold-2:#e8d08a; --gold-soft:#3a3220;
  --blue:#9aa7e6; --blue-soft:#272b45;
  --ok:#8fc49a; --ok-soft:#223526; --warn:#e0b85c; --warn-soft:#3a3018; --bad:#ec9a90; --bad-soft:#402523;
  --office:#c7aef0; --office-soft:#2f2540;
  --attn:#ff9a62; --attn-soft:#432616; --attn-ink:#1b1814;
  --g-remnant:#d8cfc2; --g-dr:#d9bc6a; --g-cai:#6cc3bb; --g-trading:#9aa7e6; --g-projects:#c7aef0; --g-personal:#e39a8f; --g-infra:#a99f90;
  --glass:rgba(27,24,20,.78); --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.6;direction:rtl;font-size:15px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline;text-decoration-color:var(--gold)}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:0 5rem;padding-inline:16px}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:plaintext}
.note{font-size:.8rem;color:var(--muted)}
.note.ok{color:var(--ok)}.note.bad{color:var(--bad)}
.empty{color:var(--muted);padding:2.5rem 0;text-align:center;font-family:var(--serif);font-size:1.05rem}

/* ---------- header + nav (שכבת זכוכית) ---------- */
header.top{padding-block:1.4rem .6rem;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
header.top h1{font-family:var(--serif);font-weight:500;font-size:2.4rem;margin:0;line-height:1;letter-spacing:-.01em}
header.top h1::before{content:"◆";color:var(--gold);font-size:.85rem;vertical-align:.5em;margin-inline-end:.5rem}
header.top .sub{color:var(--muted);display:flex;gap:.9rem;flex-wrap:wrap;font-size:.85rem}
header.top .sub span+span::before{content:"·";margin-inline-end:.9rem;color:var(--gold)}
nav.seg{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:.55rem 16px;background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;
  mask-image:linear-gradient(to bottom,#000 85%,transparent)}
nav.seg::-webkit-scrollbar{display:none}
nav.seg button{flex:none;border:1px solid transparent;background:transparent;border-radius:999px;padding:.38rem .95rem;color:var(--ink-2);font-weight:500;white-space:nowrap;transition:transform .1s ease-out,background .15s}
nav.seg button:active{transform:scale(.96)}
nav.seg button[aria-selected="true"]{background:var(--ink);color:var(--page)}
nav.seg button .n{font-size:.72rem;opacity:.65;margin-inline-start:.35rem;font-variant-numeric:tabular-nums}
@media (prefers-reduced-transparency: reduce){nav.seg{background:var(--paper);backdrop-filter:none;-webkit-backdrop-filter:none}}

/* ---------- overview: heatmap + stats ---------- */
.overview{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:1rem;margin-top:1rem;align-items:start}
.panel{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:1rem 1rem .8rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;color:var(--gold);font-weight:600;margin:0 0 .4rem}
.panel h2{font-family:var(--serif);font-weight:500;font-size:1.25rem;margin:0 0 .6rem;letter-spacing:-.005em}
.dia{overflow-x:auto}
.dia svg{display:block;width:100%;height:auto;font-family:var(--font)}
.hm-cell{cursor:pointer;transition:opacity .12s}
.hm-cell:hover rect{stroke:var(--gold)}
.stats{display:grid;gap:.5rem}
.stat{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.2rem .8rem;text-align:start;background:var(--page);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;transition:transform .1s ease-out,border-color .15s}
.stat:active{transform:scale(.98)}
.stat:hover{border-color:var(--gold-2)}
.stat b{font-family:var(--serif);font-weight:500;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;grid-row:span 2}
.stat span{font-weight:500;font-size:.95rem}
.stat small{color:var(--muted);font-size:.76rem}
.stat.on{border-color:var(--gold);background:var(--gold-soft)}
.stat.warn b{color:var(--warn)}.stat.office b{color:var(--office)}.stat.think b{color:var(--gold)}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;margin-top:1rem;padding:.8rem 1rem;background:var(--page);border:1px solid var(--line);border-radius:10px}
.filters input[type=search]{flex:1 1 240px;min-width:0;background:var(--page-2);border-color:transparent}
.fgroup{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center}
.fgroup>.lbl{font-size:.75rem;color:var(--muted);margin-inline-end:.15rem}
.chip{border:1px solid var(--line);background:var(--page);border-radius:999px;padding:.18rem .75rem;font-size:.82rem;color:var(--ink-2);transition:transform .1s ease-out}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
.chip .dot{display:inline-block;width:.5rem;height:.5rem;border-radius:2px;transform:rotate(45deg);background:var(--c,var(--gold));margin-inline-end:.4rem;vertical-align:.05em}
.range{display:flex;align-items:center;gap:.5rem;flex:1 1 260px;min-width:0}
.range input{flex:1;min-width:0;accent-color:var(--gold);padding:0;border:0;background:transparent}
.range output{font-size:.82rem;color:var(--ink);min-width:7.5rem;font-variant-numeric:tabular-nums}
select.sort{padding:.25rem .5rem;font-size:.82rem;background:var(--page-2);border-color:transparent}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.toggle button{border:0;background:transparent;padding:.18rem .7rem;font-size:.8rem;color:var(--ink-2)}
.toggle button[aria-pressed="true"]{background:var(--gold-soft);color:var(--ink)}
.resultline{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:1rem;flex-wrap:wrap}
.resultline .count{font-family:var(--serif);color:var(--ink-2)}
.clear{border:0;background:none;color:var(--blue);font-size:.85rem;padding:0}

/* ---------- sections + rails ---------- */
.section{margin-top:1.6rem}
.sec-h{display:flex;align-items:baseline;gap:.7rem;margin-bottom:.6rem}
.sec-h h3{font-family:var(--serif);font-weight:500;font-size:1.35rem;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:.55rem}
.sec-h h3::before{content:"";width:.7rem;height:.7rem;background:var(--g);transform:rotate(45deg);border-radius:2px}
.sec-h .n{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.sec-h .arrows{margin-inline-start:auto;display:flex;gap:.3rem}
.sec-h .arrows button{width:2rem;height:2rem;border-radius:50%;border:1px solid var(--line);background:var(--page);color:var(--ink-2);display:grid;place-items:center;transition:transform .1s ease-out}
.sec-h .arrows button:active{transform:scale(.92)}
.sec-h .arrows button:disabled{opacity:.3;cursor:default}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,300px);gap:.8rem;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:2px;padding:2px 2px 10px;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.rail>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}

/* box — קופסת נושא */
.box{position:relative;display:flex;flex-direction:column;gap:.45rem;text-align:start;min-width:0;min-height:12.5rem;
  background:var(--page);border:1px solid var(--line);border-radius:10px;padding:1rem 1rem .8rem;overflow:hidden;
  transition:transform .12s ease-out,border-color .15s}
.box::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--g)}
.box:hover{border-color:var(--gold-2)}
.box:active{transform:scale(.98)}
.box .top{display:flex;align-items:center;gap:.4rem;font-size:.74rem;color:var(--muted);flex-wrap:wrap}
.box .top time{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.box .t{font-family:var(--serif);font-weight:500;font-size:1.14rem;line-height:1.25;color:var(--ink);text-wrap:balance}
.box .s{font-size:.84rem;color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.box .f{margin-top:auto;display:flex;align-items:center;gap:.6rem;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:4px;border-radius:2px;background:var(--page-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:2px}
.box.done{opacity:.72}
.box.stale .top time{color:var(--warn)}

.gem{display:inline-flex;align-items:center;gap:.3rem;font-weight:500;font-size:.74rem}
.gem::before{content:"";width:.5rem;height:.5rem;transform:rotate(45deg);border-radius:1px;background:currentColor}
.gem.active,.gem.working{color:var(--ok)}.gem.paused,.gem.partial{color:var(--warn)}.gem.blocked,.gem.broken{color:var(--bad)}.gem.done,.gem.dormant,.gem.unknown{color:var(--muted)}
.tag{font-size:.68rem;padding:.02rem .45rem;border-radius:4px;font-weight:500;white-space:nowrap}
.tag.office{background:var(--office-soft);color:var(--office)}
.tag.personal{background:var(--page-2);color:var(--ink-2)}
.tag.plain{background:var(--page-2);color:var(--ink-2)}

/* ---------- reader: דף שמדפדפים ---------- */
#reader{position:fixed;inset:0;z-index:50;display:grid}
#reader[hidden]{display:none}
.r-scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .28s ease}
#reader.open .r-scrim{opacity:1}
.r-shell{position:relative;display:grid;grid-template-rows:auto 1fr auto;height:100%;max-width:880px;width:100%;margin-inline:auto;
  padding-top:calc(env(safe-area-inset-top,0px) + .6rem);padding-bottom:env(safe-area-inset-bottom,0px);
  transform:translateY(24px);opacity:0;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .2s ease}
#reader.open .r-shell{transform:none;opacity:1}
.r-bar{display:flex;align-items:center;gap:.5rem;padding:.4rem 16px .6rem;color:var(--page)}
.r-bar .ctr{font-variant-numeric:tabular-nums;font-size:.9rem;margin-inline:auto;font-family:var(--serif)}
.rbtn{width:2.4rem;height:2.4rem;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:1.05rem;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .1s ease-out,background .15s}
.rbtn:hover{background:rgba(255,255,255,.26)}
.rbtn:active{transform:scale(.92)}
.rbtn:disabled{opacity:.3;cursor:default}
.r-stage{position:relative;overflow:hidden;touch-action:pan-y;margin-inline:12px}
.pg{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;background:var(--page);border-radius:14px 14px 0 0;will-change:transform;
  background-image:linear-gradient(to left,transparent 2.3rem,var(--gold-2) 2.3rem,var(--gold-2) calc(2.3rem + 1px),transparent calc(2.3rem + 1px)),
    repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-attachment:local}
.pg.dragging{user-select:none}
.pg-in{padding:1.4rem 3.2rem 2.4rem 1.4rem;max-width:760px}
.pg .eyebrow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.pg .eyebrow .grp{color:var(--g)}
.pg h2{font-family:var(--serif);font-weight:500;font-size:2rem;line-height:1.12;letter-spacing:-.015em;margin:.2rem 0 .6rem;text-wrap:balance}
.pg .meta{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.pg .meta .bar{max-width:180px}
.pg h4{margin:1.5rem 0 .4rem;font-family:var(--serif);font-size:1rem;color:var(--gold);font-weight:500}
.pg p.stand{margin:0;color:var(--ink-2);line-height:2;font-size:.97rem}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:.15rem}
.tasks li{display:flex;gap:.6rem;align-items:flex-start;line-height:2}
.tasks input{margin-top:.6rem;accent-color:var(--gold);width:1rem;height:1rem;flex:none}
.tasks li.off label{color:var(--muted);text-decoration:line-through}
.tasks label .tag{margin-inline-end:.4rem}
.links{display:flex;flex-wrap:wrap;gap:.4rem}
.links a,.links span.f{border:1px solid var(--line);background:var(--page);border-radius:6px;padding:.25rem .65rem;font-size:.82rem;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links a{border-color:var(--gold-2)}
.links span.f{color:var(--ink-2)}
details.sub{margin-top:.6rem}
details.sub>summary{cursor:pointer;color:var(--blue);font-size:.9rem;padding:.3rem 0}
.changes{margin:0;padding-inline-start:1.1rem;color:var(--ink-2);font-size:.9rem;line-height:1.9}
.changes b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.think{margin-top:1.6rem;background:var(--gold-soft);border-radius:10px;padding:.9rem;border:1px solid var(--gold-2)}
.think label{font-size:.85rem;color:var(--ink-2);display:block;margin-bottom:.4rem;font-family:var(--serif)}
.think textarea{width:100%;min-height:84px;resize:vertical;background:var(--page)}
.think .row{display:flex;gap:.5rem;align-items:center;margin-top:.5rem;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--page);border:0;border-radius:8px;padding:.45rem 1.05rem;font-weight:500;transition:transform .1s ease-out,background .15s}
.btn:active{transform:scale(.96)}
.btn:hover{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--page-2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.r-foot{display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;align-items:center;padding:.6rem 16px .8rem;background:var(--page);margin-inline:12px;border-top:1px solid var(--rule);font-size:.8rem;color:var(--muted)}
.r-foot button{border:0;background:none;color:var(--ink-2);text-align:start;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:.2rem 0}
.r-foot button:last-child{text-align:end}
.r-foot button:disabled{opacity:.35;cursor:default}
.r-track{width:120px;height:3px;background:var(--page-2);border-radius:2px;position:relative}
.r-track i{position:absolute;top:-2px;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);margin-inline-start:-3px}

/* ---------- diagrams: flows + agents ---------- */
.flowcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem;margin-top:1rem}
.fcard{text-align:start;background:var(--page);border:1px solid var(--line);border-radius:10px;padding:.75rem .9rem;display:grid;gap:.35rem;transition:transform .1s ease-out,border-color .15s}
.fcard:active{transform:scale(.98)}
.fcard[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.fcard b{font-family:var(--serif);font-weight:500;font-size:1.05rem}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--page-2)}
.stack i{display:block;height:100%}
.stack .a{background:var(--ok)}.stack .m{background:var(--warn)}.stack .x{background:var(--bad)}
.fdesc{color:var(--ink-2);font-size:.9rem;margin:.2rem 0 .8rem}
.flowwrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:1rem;align-items:start;margin-top:1rem}
.fnode{cursor:pointer}
.fnode:hover .nb{stroke:var(--gold)}
.detail{position:sticky;top:4.2rem}
.detail h3{font-family:var(--serif);font-weight:500;font-size:1.2rem;margin:.1rem 0 .5rem;line-height:1.3}
.detail dl{margin:0;display:grid;gap:.5rem}
.detail dt{font-size:.72rem;color:var(--gold);font-weight:600;letter-spacing:.06em}
.detail dd{margin:0;color:var(--ink-2);font-size:.9rem}
.gate{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:.5rem .8rem;font-size:.86rem;margin-top:.35rem}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.7rem;margin-top:.8rem}
.abox{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:.85rem .95rem;display:grid;gap:.35rem;align-content:start;min-width:0}
.abox b{font-family:var(--serif);font-weight:500;font-size:1.04rem;line-height:1.3}
.abox .what{color:var(--ink-2);font-size:.84rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.abox.open .what{display:block}
.abox .more{display:none;font-size:.8rem;color:var(--muted);gap:.3rem}
.abox.open .more{display:grid}
.abox .issue{color:var(--bad)}
.abox .row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.abox .tog{justify-self:start;border:0;background:none;color:var(--blue);font-size:.8rem;padding:0}
.kids{border-inline-start:2px solid var(--rule);padding-inline-start:.6rem;display:grid;gap:.25rem;font-size:.8rem;color:var(--ink-2)}

/* skills / sites / thoughts */
.sbox{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:.85rem .95rem;display:grid;gap:.35rem;align-content:start;text-align:start;min-width:0;min-height:9rem}
.sbox b{font-weight:600;font-size:.95rem}
.sbox .p{display:-webkit-box;margin:0;font-size:.85rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sbox.open .p{display:block}
.sbox code{font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sbox .n2{font-size:.78rem;color:var(--muted);display:none}
.sbox.open .n2{display:block}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.6rem}

<script>
(function(){
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GROUPS={remnant:'REMNANT','diana-rafael':'דיאנה רפאל',customizeai:'CustomizeAI',trading:'מניות',projects:'פרויקטים',personal:'אישי',infra:'תשתית'};
const GVAR={remnant:'--g-remnant','diana-rafael':'--g-dr',customizeai:'--g-cai',trading:'--g-trading',projects:'--g-projects',personal:'--g-personal',infra:'--g-infra'};
const STATUS={active:'פעיל',paused:'מושהה',blocked:'חסום',done:'סיימנו'};
const ASTAT={working:'עובד',broken:'שבור',partial:'חלקי',dormant:'רדום',unknown:'לא ידוע'};
const MACH={home:'בית',office:'משרד',cloud:'ענן',make:'Make',both:'שני המחשבים'};
const TABS=[['board','לוח'],['flows','פלואים'],['agents','סוכנים'],['skills','יכולות'],['sites','אתרים'],['thoughts','מחשבות']];
const MAXDAYS=121; // slider end = "הכול"
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const state={tab:'board',q:'',group:null,status:'open',kind:null,office:false,attn:false,days:MAXDAYS,stale:false,sort:'recent',layout:'rails',
  data:{chapters:[],skills:{categories:[]},agents:{tree:[],flows:{}},extras:{}},db:null,chapterDocs:{},thoughts:[],drafts:{},
  flow:null,flowStep:0,agentCat:null,sq:'',so:null,tf:'pending'};
try{const s=JSON.parse(localStorage.getItem('nb-ui4')||'{}');for(const k of ['tab','group','status','kind','sort','layout','days'])if(s[k]!=null)state[k]=s[k];state.days=+state.days||MAXDAYS}catch(e){}
function saveUI(){try{localStorage.setItem('nb-ui4',JSON.stringify({tab:state.tab,group:state.group,status:state.status,kind:state.kind,sort:state.sort,layout:state.layout,days:state.days}))}catch(e){}}
$('#today').textContent=new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

/* ---------- data ---------- */
async function loadJSON(p){try{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch(e){return null}}
async function loadData(){
  const [c,s,a,x]=await Promise.all([loadJSON('data/chapters.json'),loadJSON('data/skills.json'),loadJSON('data/agents.json'),loadJSON('data/extras.json')]);
  if(c)state.data.chapters=c; if(s)state.data.skills=s; if(a)state.data.agents=a; if(x)state.data.extras=x;
  $('#loadstate').textContent=`${state.data.chapters.length} נושאים · עודכן ${state.data.extras.generated||''}`;
  render();
}
async function initDB(){
  const db=await window.claude?.use?.('db').catch(()=>null);
  if(!db){$('#dbstate').textContent='ללא אחסון (קריאה בלבד)';return}
  state.db=db;$('#dbstate').textContent='אחסון מחובר';
  db.collection('chapters').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});state.chapterDocs=m;
    if(state.tab==='board')updateBoard();updateTabs();if(R.open)refreshReaderMeta()},e=>{$('#dbstate').textContent='אחסון: '+e.code});
  db.collection('thoughts').orderBy('ts','desc').limit(200).onSnapshot(snap=>{state.thoughts=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(state.tab==='thoughts')render();else updateTabs();if(state.tab==='board')updateStats()},()=>{});
}
async function setChapter(id,patch){
  if(!state.db)return false;
  const cur=state.chapterDocs[id]||{};
  try{await state.db.doc('chapters/'+id).set({...cur,...patch,updated:new Date().toISOString()});return true}catch(e){return false}
}
async function sendThought(id,title,text){
  if(!state.db)return false;
  try{await state.db.collection('thoughts').add({chapter:id,chapterTitle:title,text,ts:new Date().toISOString(),handled:false});return true}catch(e){return false}
}

/* ---------- helpers ---------- */
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
function age(c){if(!c.last_update)return 999;const d=new Date(c.last_update+'T00:00:00');return Math.max(0,Math.round((TODAY-d)/864e5))}
function rel(c){const a=age(c);if(a===999)return '';if(a===0)return 'היום';if(a===1)return 'אתמול';if(a<7)return `לפני ${a} ימים`;const [y,m,d]=c.last_update.split('-');return `${+d}.${+m}`}
function isDone(c){const d=state.chapterDocs[c.id];return d&&typeof d.done==='boolean'?d.done:c.status==='done'}
function eff(c){return isDone(c)?'done':c.status}
function attn(c){if(isDone(c))return [];const a=Array.isArray(c.attention)?c.attention:[];const l=a.map(x=>typeof x==='string'?{text:x}:x).filter(x=>x&&x.text);if(!l.length&&c.needs_attention)l.push({text:c.attention_note||'דורש טיפול'});return l}
function prog(c){const n=(c.next_tasks||[]).length;const t=(state.chapterDocs[c.id]||{}).tasks||{};let d=0;for(let i=0;i<n;i++)if(t[i])d++;return {n,d}}
function gstyle(g){return `--g:var(${GVAR[g]||'--g-infra'})`}
function firstLine(s){return (s||'').split(/(?<=[.!?])\s|\n/)[0]}
function countTree(t){return t.reduce((n,x)=>n+1+countTree(x.children||[]),0)}
function site(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}
function flat(t,out=[]){t.forEach(x=>{out.push(x);flat(x.children||[],out)});return out}

/* ---------- tabs ---------- */
function updateTabs(){
  const ch=state.data.chapters;const open=ch.filter(c=>!isDone(c)).length;const pend=state.thoughts.filter(t=>!t.handled).length;
  const counts={board:open,flows:Object.keys(state.data.agents.flows||{}).length,agents:countTree(state.data.agents.tree||[]),
    skills:(state.data.skills.categories||[]).reduce((n,c)=>n+(c.items||[]).length,0),sites:(state.data.extras.live_sites||[]).length,thoughts:pend};
  $('#tabs').innerHTML=TABS.map(([id,l])=>`<button role="tab" aria-selected="${state.tab===id}" data-tab="${id}">${l}<span class="n">${counts[id]||''}</span></button>`).join('');
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;saveUI();render();window.scrollTo({top:0})});
function render(){updateTabs();const old=$('#view');const v=old.cloneNode(false);old.replaceWith(v);({board:renderBoard,flows:renderFlows,agents:renderAgents,skills:renderSkills,sites:renderSites,thoughts:renderThoughts})[state.tab](v)}

/* =========================================================
   BOARD — מפת חום + פילטרים + קופסאות במסילות לפי נושא
   ========================================================= */
function filtered(){
  let list=state.data.chapters.slice();const q=state.q.trim();
  if(state.status==='open')list=list.filter(c=>!isDone(c));
  else if(state.status)list=list.filter(c=>eff(c)===state.status);
  if(state.group)list=list.filter(c=>c.group===state.group);
  if(state.kind)list=list.filter(c=>c.kind===state.kind);
  if(state.office)list=list.filter(c=>c.office_only);
  if(state.attn)list=list.filter(c=>attn(c).length);
  if(state.stale)list=list.filter(c=>age(c)>=14);
  else if(state.days<MAXDAYS)list=list.filter(c=>age(c)<=state.days);
  if(q)list=list.filter(c=>JSON.stringify(c).includes(q));
  const S={recent:(a,b)=>(b.last_update||'').localeCompare(a.last_update||''),
    tasks:(a,b)=>{const pa=prog(a),pb=prog(b);return (pb.n-pb.d)-(pa.n-pa.d)},
    status:(a,b)=>['blocked','active','paused','done'].indexOf(eff(a))-['blocked','active','paused','done'].indexOf(eff(b)),
    name:(a,b)=>a.title.localeCompare(b.title,'he'),
    attn:(a,b)=>attn(b).length-attn(a).length||(b.last_update||'').localeCompare(a.last_update||'')};
  return list.sort(S[state.sort]||S.recent);
}

function drawHeat(){
  const el=$('#heat');if(!el)return;

  const max=Math.max(1,...rows.flatMap(g=>cols.map(([s])=>cnt(g,s))));
  const LW=112,CW=72,CH=32,G=4,TOP=28,W=LW+cols.length*(CW+G)+44,H=TOP+rows.length*(CH+G)+36;
  const cx=i=>W-LW-(i+1)*(CW+G);

  <title id="heat-title">מפת הנושאים לפי תחום ומצב</title><desc id="heat-desc">כמה נושאים יש בכל תחום בכל מצב; תא כהה יותר הוא תא עם יותר נושאים, ולחיצה עליו מסננת את הלוח.</desc>`;

  s+=`<text x="${44/2}" y="15" text-anchor="middle" style="font-size:11px;fill:var(--muted)">סה״כ</text>`;
  rows.forEach((g,r)=>{const y=TOP+r*(CH+G);const on=state.group===g;const tot=cols.reduce((n,[k])=>n+cnt(g,k),0);
    s+=`<g class="hm-cell" data-hm="${g}|" role="button" tabindex="0" aria-label="סנן לפי ${GROUPS[g]}"><rect x="${W-LW}" y="${y}" width="${LW}" height="${CH}" rx="4" style="fill:${on?'var(--gold-soft)':'transparent'}"/>
      <rect x="${W-12}" y="${y+CH/2-4}" width="8" height="8" rx="1" transform="rotate(45 ${W-8} ${y+CH/2})" style="fill:var(${GVAR[g]})"/>
      <text x="${W-22}" y="${y+CH/2+4.5}" text-anchor="start" direction="rtl" style="font-size:13px;font-weight:${on?600:500};fill:var(--ink)">${h(GROUPS[g])}</text></g>`;
    cols.forEach(([k,l],i)=>{const n=cnt(g,k);const sel=state.group===g&&state.status===k;const op=n?(.16+.7*n/max).toFixed(2):0;
      s+=`<g class="hm-cell" data-hm="${g}|${k}" role="button" tabindex="0" aria-label="${GROUPS[g]}, ${l}: ${n}"><rect x="${cx(i)}" y="${y}" width="${CW}" height="${CH}" rx="4" style="fill:${n?'var(--gold)':'var(--page-2)'};fill-opacity:${n?op:1};stroke:${sel?'var(--ink)':'transparent'};stroke-width:1.5"/>
      ${n?`<text x="${cx(i)+CW/2}" y="${y+CH/2+5}" text-anchor="middle" style="font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;fill:${n/max>.55?'var(--page)':'var(--ink)'}">${n}</text>`:''}</g>`});
    s+=`<text x="22" y="${y+CH/2+5}" text-anchor="middle" style="font-size:13px;fill:var(--muted);font-variant-numeric:tabular-nums">${tot}</text>`});
  const ly=H-14;
  s+=`<line x1="0" y1="${ly-14}" x2="${W}" y2="${ly-14}" style="stroke:var(--rule)"/>
  <text x="${W}" y="${ly}" text-anchor="start" direction="rtl" style="font-size:11px;fill:var(--muted)">עוצמת הזהב = מספר נושאים · לחיצה על תא, שורה או עמודה מסננת את הלוח</text></svg>`;
  el.innerHTML=s;
  el.querySelectorAll('[role=button]').forEach(g=>g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();g.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}));

/* =========================================================
   READER — דף אחד בכל פעם, מדפדפים בהחלקה / חצים / מקלדת
   קפיץ קריטי-מרוסן כברירת מחדל, מעט קפיציות רק אחרי הנפה; תמיד ניתן לתפוס באמצע.

const R={open:false,list:[],i:0,x:0,w:0,stop:null,drag:null};
const GAP=28;
const stage=$('#r-stage');const slots={prev:stage.querySelector('[data-slot=prev]'),cur:stage.querySelector('[data-slot=cur]'),next:stage.querySelector('[data-slot=next]')};
function spring(from,to,v0,onUpd,onDone,o={}){
  const resp=o.response||.38,damp=o.damping??1;const k=Math.pow(2*Math.PI/resp,2),c=4*Math.PI*damp/resp;
  let x=from-to,v=v0,last=performance.now(),raf;
  const step=t=>{const dt=Math.min(.034,(t-last)/1000);last=t;for(let i=0;i<4;i++){const hh=dt/4;const a=-k*x-c*v;v+=a*hh;x+=v*hh}
    onUpd(to+x);if(Math.abs(x)<.4&&Math.abs(v)<8){onUpd(to);onDone&&onDone();return}raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);return()=>cancelAnimationFrame(raf);
}
const project=(v,d=.998)=>(v/1000)*d/(1-d);
function rubber(o,dim,c=.55){return (o*dim*c)/(dim+c*Math.abs(o))}
function hasNext(){return R.i<R.list.length-1}function hasPrev(){return R.i>0}
function layout(){
  let x=R.x;if(x>0&&!hasNext())x=rubber(x,R.w);if(x<0&&!hasPrev())x=rubber(x,R.w);
  // RTL: הדף הבא יושב משמאל; גוררים ימינה כדי להביא אותו
  slots.cur.style.transform=`translate3d(${x}px,0,0)`;
  slots.next.style.transform=`translate3d(${x-(R.w+GAP)}px,0,0)`;
  slots.prev.style.transform=`translate3d(${x+(R.w+GAP)}px,0,0)`;
}

function swCross(items){ // the same post on IG and on the FB Page -> ONE card with both platform labels

      <rect x="${xr-4}" y="${n.y}" width="4" height="${n.hgt}" style="fill:${st.k}"/>
      <text x="${xr-PAD-4}" y="${n.y+PAD+15}" text-anchor="start" direction="rtl" style="font-family:var(--serif);font-size:22px;fill:var(--gold)">${h(n.s.n)}</text>
      ${n.lines.map((l,j)=>`<text x="${xr-PAD-40}" y="${n.y+PAD+14+j*20}" text-anchor="start" direction="rtl" style="font-size:14.5px;font-weight:600;fill:var(--ink)">${h(l)}</text>`).join('')}
      ${n.s.tool?`<text x="${xr-PAD-40}" y="${n.y+PAD+14+n.lines.length*20+2}" text-anchor="start" direction="rtl" style="font-size:11px;fill:var(--muted)">${h(String(n.s.tool).slice(0,64))}</text>`:''}
      <rect x="${X0+12}" y="${n.y+PAD-2}" width="54" height="18" rx="2" style="fill:var(--page);stroke:${st.k}"/>
      <text x="${X0+39}" y="${n.y+PAD+11}" text-anchor="middle" style="font-size:10.5px;font-weight:600;fill:${st.k}">${st.t}</text></g>`});
  const ly=H-22;
  out+=`<line x1="0" y1="${ly-18}" x2="${W}" y2="${ly-18}" style="stroke:var(--rule)"/>`;
  [['auto','אוטומטי'],['manual','ידני — דורש אותך או אותי'],['broken','שבור']].forEach(([k,l],i)=>{const x=W-8-i*170;
    out+=`<rect x="${x-12}" y="${ly-9}" width="12" height="12" rx="2" style="fill:${STY[k].f};stroke:${STY[k].k}"/><text x="${x-18}" y="${ly+1}" text-anchor="start" direction="rtl" style="font-size:11.5px;fill:var(--ink-2)">${l}</text>`});
  return out+'</svg>';
}
function renderFlows(v){
  const fl=state.data.agents.flows||{};const keys=Object.keys(fl);
  if(!keys.length){v.innerHTML='<div class="empty">אין פלואים עדיין</div>';return}
  if(!fl[state.flow]){state.flow=keys[0];state.flowStep=0}
  const cnt=f=>{const s=f.steps||[];return {a:s.filter(x=>x.status==='auto').length,m:s.filter(x=>x.status==='manual').length,x:s.filter(x=>x.status==='broken').length,n:s.length}};
  v.innerHTML=`<div class="flowcards">${keys.map(k=>{const c=cnt(fl[k]);return `<button class="fcard" data-flow="${h(k)}" aria-pressed="${state.flow===k}">
    <b>${h(fl[k].title||k)}</b><span class="stack" aria-hidden="true"><i class="a" style="width:${100*c.a/c.n}%"></i><i class="m" style="width:${100*c.m/c.n}%"></i><i class="x" style="width:${100*c.x/c.n}%"></i></span>
    <span class="note">${c.n} שלבים · ${c.a} אוטומטיים · ${c.m} ידניים${c.x?` · <span style="color:var(--bad)">${c.x} שבורים</span>`:''}</span></button>`}).join('')}</div>
    <div class="flowwrap"><div class="panel"><p class="eyebrow">פלואו</p><h2 id="fl-h"></h2><p class="fdesc" id="fl-when"></p><div class="dia" id="fl-dia"></div></div>
    <aside class="panel detail" id="fl-detail" aria-live="polite"></aside></div>`;
  v.querySelectorAll('[data-flow]').forEach(b=>b.addEventListener('click',()=>{state.flow=b.dataset.flow;state.flowStep=0;v.querySelectorAll('[data-flow]').forEach(x=>x.setAttribute('aria-pressed',x===b));drawFlow()}));
  drawFlow();
}
function drawFlow(){
  const f=state.data.agents.flows[state.flow];$('#fl-h').textContent=f.title;$('#fl-when').textContent=f.when||'';
  $('#fl-dia').innerHTML=flowSVG(state.flow.replace(/[^a-z0-9-]/gi,''),f);
  $('#fl-dia').querySelectorAll('.fnode').forEach(g=>{const pick=()=>{state.flowStep=+g.dataset.step;drawFlow()};g.addEventListener('click',pick);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}})});
  const s=(f.steps||[])[state.flowStep]||{};
  $('#fl-detail').innerHTML=`<p class="eyebrow">שלב ${h(s.n)} מתוך ${(f.steps||[]).length}</p><h3>${h(s.title)}</h3>
    <dl>${s.who?`<dt>מי</dt><dd>${h(s.who)}</dd>`:''}${s.tool?`<dt>כלי</dt><dd>${h(s.tool)}</dd>`:''}
    <dt>מצב</dt><dd><span class="gem ${s.status==='auto'?'working':s.status==='manual'?'partial':'broken'}">${{auto:'אוטומטי',manual:'ידני',broken:'שבור'}[s.status]||h(s.status)}</span></dd>
    ${s.notes?`<dt>הערות</dt><dd>${h(s.notes)}</dd>`:''}</dl>
    ${(f.approval_gates||[]).length?`<p class="eyebrow" style="margin-top:1.2rem">שערי אישור</p>${f.approval_gates.map(g=>`<div class="gate">${h(g)}</div>`).join('')}`:''}
    ${(f.open_improvements||[]).length?`<details class="sub"><summary>שיפורים פתוחים (${f.open_improvements.length})</summary><ul class="changes">${f.open_improvements.map(x=>`<li>${h(x)}</li>`).join('')}</ul></details>`:''}`;
}

/* =========================================================
   AGENTS — diagram-design "Tree": המפעיל → 4 ענפי טריגר, חיבורי מרפק r=8, נקודות חיבור נפרדות
   ========================================================= */
function health(list){const all=flat(list);return {w:all.filter(x=>x.status==='working').length,p:all.filter(x=>x.status==='partial').length,b:all.filter(x=>x.status==='broken').length,n:all.length}}
function treeSVG(root){
  const kids=root.children||[];const N=kids.length;const W=760,RW=260,RH=60,CW=172,CH=92,CG=(W-N*CW)/Math.max(1,N-1),CY=150;
  const rx=(W-RW)/2;const r=8;
  // RTL: הענף הראשון מימין
  const ccx=i=>W-(i*(CW+CG))-CW/2;
  let s=`<svg viewBox="0 0 ${W} ${CY+CH+50}" role="img" aria-labelledby="tree-title tree-desc">
  <title id="tree-title">מבנה הסוכנים</title><desc id="tree-desc">Claude Code מפעיל ${N} ענפים: ${kids.map(k=>h(k.title)).join(', ')}; לכל ענף מספר הסוכנים ומצב הבריאות שלהם.</desc>`;
  kids.forEach((k,i)=>{const ax=rx+RW*(N-i)/(N+1);const tx=ccx(i);const outer=(i===0||i===N-1);const my=outer?96:108;const dir=tx>ax?1:-1;
    s+=`<path d="M${ax} ${RH+8} V${my-r} Q${ax} ${my} ${ax+dir*r} ${my} H${tx-dir*r} Q${tx} ${my} ${tx} ${my+r} V${CY-2}" style="fill:none;stroke:var(--muted);stroke-width:1.25" marker-end="url(#tree-ah)"/>`});
  s+=`<defs><marker id="tree-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker></defs>`;
  const rh=health([root]);
  s+=`<rect x="${rx}" y="8" width="${RW}" height="${RH}" rx="6" style="fill:var(--gold-soft);stroke:var(--gold);stroke-width:1.5"/>
   <text x="${W/2}" y="34" text-anchor="middle" style="font-size:15px;font-weight:600;fill:var(--ink)">${h(root.title)}</text>
   <text x="${W/2}" y="54" text-anchor="middle" style="font-size:11px;fill:var(--muted)">${rh.n} רכיבים · ${rh.w} עובדים · ${rh.p} חלקי · ${rh.b} שבורים</text>`;
  kids.forEach((k,i)=>{const x=ccx(i)-CW/2;const hh=health(k.children||[]);const sel=state.agentCat===k.id;const bw=CW-24;
    const seg=(n,c,off)=>n?`<rect x="${x+12+off}" y="${CY+66}" width="${bw*n/Math.max(1,hh.n)}" height="6" style="fill:${c}"/>`:'';
    s+=`<g class="fnode" data-cat="${h(k.id)}" role="button" tabindex="0" aria-label="${h(k.title)}">
     <rect class="nb" x="${x}" y="${CY}" width="${CW}" height="${CH}" rx="6" style="fill:${sel?'var(--gold-soft)':'var(--page)'};stroke:${sel?'var(--gold)':'var(--line)'};stroke-width:${sel?1.5:1}"/>
     ${wrapText(k.title.replace(/\s*\(.*\)\s*/,''),20).slice(0,2).map((l,j)=>`<text x="${x+CW/2}" y="${CY+24+j*17}" text-anchor="middle" style="font-size:13px;font-weight:600;fill:var(--ink)">${h(l)}</text>`).join('')}
     <text x="${x+CW/2}" y="${CY+58}" text-anchor="middle" style="font-size:11px;fill:var(--muted)">${hh.n} רכיבים</text>
     <rect x="${x+12}" y="${CY+66}" width="${bw}" height="6" rx="3" style="fill:var(--page-2)"/>
     ${seg(hh.w,'var(--ok)',0)}${seg(hh.p,'var(--warn)',bw*hh.w/Math.max(1,hh.n))}${seg(hh.b,'var(--bad)',bw*(hh.w+hh.p)/Math.max(1,hh.n))}</g>`});
  const ly=CY+CH+32;
  [['var(--ok)','עובד'],['var(--warn)','חלקי'],['var(--bad)','שבור']].forEach(([c,l],i)=>{const x=W-8-i*90;s+=`<rect x="${x-10}" y="${ly-9}" width="10" height="10" rx="2" style="fill:${c}"/><text x="${x-16}" y="${ly}" text-anchor="start" direction="rtl" style="font-size:11.5px;fill:var(--ink-2)">${l}</text>`});
  s+=`<text x="0" y="${ly}" text-anchor="start" style="font-size:11px;fill:var(--muted)">לחץ על ענף כדי לסנן</text>`;
  return s+'</svg>';
}
function renderAgents(v){
  const t=state.data.agents.tree||[];if(!t.length){v.innerHTML='<div class="empty">אין נתוני סוכנים עדיין</div>';return}
  const root=t[0];
  v.innerHTML=`<div class="panel" style="margin-top:1rem"><p class="eyebrow">סוכנים</p><h2>מי רץ, מתי, ומה המצב</h2><div class="dia" id="tree"></div></div>
   <div class="filters"><div class="fgroup" id="a-st"></div><div class="fgroup" id="a-m"></div></div><div id="a-list"></div>`;
  const draw=()=>{
    $('#tree').innerHTML=treeSVG(root);
    $('#tree').querySelectorAll('[data-cat]').forEach(g=>{const pick=()=>{state.agentCat=state.agentCat===g.dataset.cat?null:g.dataset.cat;draw()};g.addEventListener('click',pick);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}})});
    $('#a-st').innerHTML=`<span class="lbl">מצב</span>`+Object.entries({working:'עובד',partial:'חלקי',broken:'שבור',dormant:'רדום'}).map(([k,l])=>`<button class="chip" data-ast="${k}" aria-pressed="${state.ast===k}">${l}</button>`).join('');
    $('#a-m').innerHTML=`<span class="lbl">איפה</span>`+Object.entries(MACH).map(([k,l])=>`<button class="chip" data-am="${k}" aria-pressed="${state.am===k}">${l}</button>`).join('');
    const cats=(root.children||[]).filter(k=>!state.agentCat||k.id===state.agentCat);
    $('#a-list').innerHTML=cats.map(k=>{let items=k.children||[];if(state.ast)items=items.filter(x=>x.status===state.ast);if(state.am)items=items.filter(x=>x.machine===state.am);
      if(!items.length)return '';
      return `<section class="section"><div class="sec-h"><h3 style="--g:var(--gold)">${h(k.title)}</h3><span class="n">${items.length}</span></div>
      ${k.what?`<p class="note" style="margin:-.3rem 0 .4rem">${h(k.what)}</p>`:''}<div class="agrid">${items.map(abox).join('')}</div></section>`}).join('')||'<div class="empty">אין סוכנים שתואמים לסינון</div>';
  };
  v.addEventListener('click',e=>{const b=e.target.closest('[data-ast],[data-am],[data-tog]');if(!b)return;
    if(b.dataset.tog){b.closest('.abox').classList.toggle('open');b.textContent=b.closest('.abox').classList.contains('open')?'פחות':'עוד';return}
    if(b.dataset.ast)state.ast=state.ast===b.dataset.ast?null:b.dataset.ast;else state.am=state.am===b.dataset.am?null:b.dataset.am;draw()});
  draw();
}
function abox(n){const kids=n.children||[];
  return `<div class="abox"><div class="row">${n.status?`<span class="gem ${h(n.status)}">${ASTAT[n.status]||h(n.status)}</span>`:''}${n.machine?`<span class="tag plain">${MACH[n.machine]||h(n.machine)}</span>`:''}</div>
   <b>${h(n.title)}</b>${n.schedule?`<span class="note">${h(n.schedule)}</span>`:''}${n.what?`<div class="what">${h(n.what)}</div>`:''}
   <div class="more">${n.io?`<span>${h(n.io)}</span>`:''}${n.last_run?`<span>ריצה אחרונה: ${h(n.last_run)}</span>`:''}${n.known_issues?`<span class="issue">${h(n.known_issues)}</span>`:''}
   ${(n.files||[]).some(f=>/^https?:/.test(f))?`<div class="links">${n.files.filter(f=>/^https?:/.test(f)).map(f=>`<a href="${h(f)}" target="_blank" rel="noopener">${h(site(f))}</a>`).join('')}</div>`:''}
   ${kids.length?`<div class="kids">${kids.map(k=>`<span><span class="gem ${h(k.status||'unknown')}"></span> ${h(k.title)}</span>`).join('')}</div>`:''}</div>
   ${(n.io||n.last_run||n.known_issues||(n.files||[]).some(f=>/^https?:/.test(f))||kids.length||(n.what||'').length>140)?'<button class="tog" data-tog="1">עוד</button>':''}</div>`}

/* ---------- skills ---------- */
function renderSkills(v){
  const cats=state.data.skills.categories||[];
  v.innerHTML=`<div class="filters"><input type="search" id="sq" placeholder="חיפוש יכולת…" value="${h(state.sq)}" aria-label="חיפוש יכולת"></div><div id="s-list"></div>`;
  const draw=()=>{const q=state.sq.trim();
    $('#s-list').innerHTML=cats.map(c=>{let items=c.items||[];if(state.so)items=items.filter(i=>i.origin===state.so);if(q)items=items.filter(i=>JSON.stringify(i).includes(q));if(!items.length)return '';
      return `<section class="section"><div class="sec-h"><h3 style="--g:var(--gold)">${h(c.icon||'')} ${h(c.title)}</h3><span class="n">${items.length}</span></div>
      <div class="grid">${items.map(i=>`<button class="sbox" data-sk="1"><span class="row" style="display:flex;gap:.4rem;align-items:center;justify-content:space-between"><b>${h(i.name)}</b>${i.status?`<span class="gem ${h(i.status)}">${ASTAT[i.status]||h(i.status)}</span>`:''}</span>
        <span class="p">${h(i.title)}</span>${i.trigger?`<code title="${h(i.trigger)}">${h(i.trigger)}</code>`:''}${i.notes?`<span class="n2">${h(i.notes)}</span>`:''}</button>`).join('')}</div></section>`}).join('')||'<div class="empty">אין יכולות שתואמות</div>';};
  $('#sq').addEventListener('input',e=>{state.sq=e.target.value;draw()});
  v.addEventListener('click',e=>{const o=e.target.closest('[data-o]');if(o){state.so=state.so===o.dataset.o?null:o.dataset.o;draw();return}
    const b=e.target.closest('[data-sk]');if(b)b.classList.toggle('open')});
  draw();
}
/* ---------- sites ---------- */
function renderSites(v){const s=state.data.extras.live_sites||[];const by={};s.forEach(x=>{(by[x.topic||'אחר']=by[x.topic||'אחר']||[]).push(x)});
  const ent=Object.entries(by).sort((a,b)=>b[1].length-a[1].length);
  v.innerHTML=ent.map(([t,arr])=>`<section class="section"><div class="sec-h"><h3 style="--g:var(--gold)">${h(t)}</h3><span class="n">${arr.length}</span></div><div class="sites">${arr.map(x=>`<a href="${h(x.url)}" target="_blank" rel="noopener">${h(x.label)}<small>${h(site(x.url))}</small></a>`).join('')}</div></section>`).join('')||'<div class="empty">אין קישורים עדיין</div>';}
/* ---------- thoughts ---------- */
function renderThoughts(v){let t=state.thoughts;const pend=t.filter(x=>!x.handled).length;
  if(state.tf==='pending')t=t.filter(x=>!x.handled);else if(state.tf==='done')t=t.filter(x=>x.handled);
  v.innerHTML=`<div class="filters"><div class="fgroup">${[['pending',`ממתינות (${pend})`],['done','טופלו'],['all','הכול']].map(([k,l])=>`<button class="chip" data-tf="${k}" aria-pressed="${state.tf===k}">${l}</button>`).join('')}</div>
    <span class="note">כל מה ששלחת מדפי הנושאים. אני מסמן "טופל" וכותב תשובה אחרי שקראתי וסידרתי.</span></div>
    <div class="tlist">${t.length?t.map(x=>`<div class="titem ${x.handled?'h1':''}"><div class="h"><b>${h(x.chapterTitle||x.chapter)}</b><span>${h(new Date(x.ts).toLocaleString('he-IL'))}</span><span class="gem ${x.handled?'working':'partial'}">${x.handled?'טופל':'ממתין'}</span></div><p>${h(x.text)}</p>${x.reply?`<div class="reply">${h(x.reply)}</div>`:''}</div>`).join(''):`<div class="empty">${state.tf==='pending'?'אין מחשבות שממתינות. הכול טופל.':'עוד לא נשלחו מחשבות'}</div>`}</div>`;
  v.querySelectorAll('[data-tf]').forEach(b=>b.addEventListener('click',()=>{state.tf=b.dataset.tf;render()}));}

const hash=location.hash.replace('#','');if(TABS.some(t=>t[0]===hash))state.tab=hash;
render();loadData();initDB();
})();
</script>
