<title>המחברת</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap">
<style>
/* "מחברת של צורף": נייר בון חם, קו-שוליים זהב, חוצצי אינדקס צבעוניים לטאבים, סטטוסים כאבנים קטנות. בהיר, קליל, בלי רעש. */
:root{
  --paper:#f7f3ea; --page:#fffdf8; --page-2:#f1ebdf; --rule:#e6dcc8; --line:#d9cfb9;
  --ink:#2b2622; --ink-2:#5a534b; --muted:#8c8376;
  --gold:#b8963a; --gold-2:#d9bc6a; --gold-soft:#f3e9cf;
  --blue:#4b5a9e; --blue-soft:#e3e6f3;
  --ok:#4f7d5a; --ok-soft:#e1ecdf; --warn:#a27a1e; --warn-soft:#f5ead0; --bad:#a9544c; --bad-soft:#f3dfdb;
  --office:#6d4c9a; --office-soft:#ebe3f4;
  --tab1:#b8963a;--tab2:#8c8376;--tab3:#4b5a9e;--tab4:#4f7d5a;--tab5:#a9544c;--tab6:#6d4c9a;--tab7:#2f7f7a;
  --font:'Heebo',system-ui,sans-serif; --serif:'Frank Ruhl Libre',Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1d1a16; --page:#262219; --page-2:#2e2920; --rule:#3a3429; --line:#4a4236;
  --ink:#efe8da; --ink-2:#c9c0b0; --muted:#948b7c;
  --gold:#d9bc6a; --gold-2:#e8d08a; --gold-soft:#3a3220;
  --blue:#9aa7e6; --blue-soft:#272b45;
  --ok:#8fc49a; --ok-soft:#223526; --warn:#e0b85c; --warn-soft:#3a3018; --bad:#ec9a90; --bad-soft:#402523;
  --office:#c7aef0; --office-soft:#2f2540; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1d1a16; --page:#262219; --page-2:#2e2920; --rule:#3a3429; --line:#4a4236;
  --ink:#efe8da; --ink-2:#c9c0b0; --muted:#948b7c;
  --gold:#d9bc6a; --gold-2:#e8d08a; --gold-soft:#3a3220;
  --blue:#9aa7e6; --blue-soft:#272b45;
  --ok:#8fc49a; --ok-soft:#223526; --warn:#e0b85c; --warn-soft:#3a3018; --bad:#ec9a90; --bad-soft:#402523;
  --office:#c7aef0; --office-soft:#2f2540; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:400;line-height:1.65;direction:rtl;font-size:15px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline;text-decoration-color:var(--gold)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:6px;padding:.5rem .7rem}
input:focus,textarea:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-block:0 4rem;padding-inline:16px}

/* header — כותרת של פנקס */
header.top{padding-block:1.6rem .4rem;display:grid;gap:.2rem}
header.top h1{font-family:var(--serif);font-weight:500;font-size:2.3rem;margin:0;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
header.top h1::before{content:"◆";color:var(--gold);font-size:.9rem;vertical-align:.45em;margin-inline-end:.5rem}
header.top .sub{color:var(--muted);display:flex;gap:1.2rem;flex-wrap:wrap;font-family:var(--serif);font-size:.95rem}
header.top .sub span:nth-child(n+2)::before{content:"·";margin-inline-end:1.2rem;color:var(--gold)}

/* tabs — חוצצי אינדקס */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);padding-block:.6rem 0;display:flex;gap:.3rem;flex-wrap:wrap;border-bottom:1px solid var(--gold);align-items:flex-end}
.tabs button{background:var(--page-2);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;padding:.4rem .9rem .35rem;color:var(--ink-2);font-weight:500;position:relative;top:1px;border-top:3px solid var(--tc,var(--gold))}
.tabs button:nth-child(1){--tc:var(--tab1)}.tabs button:nth-child(2){--tc:var(--tab2)}.tabs button:nth-child(3){--tc:var(--tab3)}.tabs button:nth-child(4){--tc:var(--tab4)}.tabs button:nth-child(5){--tc:var(--tab5)}.tabs button:nth-child(6){--tc:var(--tab6)}.tabs button:nth-child(7){--tc:var(--tab7)}
.tabs button[aria-selected="true"]{background:var(--page);color:var(--ink);border-color:var(--gold);border-bottom:1px solid var(--page);padding-bottom:.45rem;font-family:var(--serif);font-size:1.02rem}
.tabs button .n{font-size:.7rem;color:var(--muted);margin-right:.35rem;font-family:var(--font);font-variant-numeric:tabular-nums}

/* page sheet */
#view{background:var(--page);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:.6rem 1rem 1.2rem;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-attachment:local}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #view{background-image:none}}
:root[data-theme="dark"] #view{background-image:none}

/* filter bar */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;padding-block:.6rem .5rem;background:var(--page)}
.filters input[type=search]{flex:1 1 220px;min-width:0;background:var(--page-2)}
.chips{display:flex;gap:.3rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--page);border-radius:999px;padding:.15rem .7rem;font-size:.8rem;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.count{font-size:.8rem;color:var(--muted);margin-inline-start:auto;font-family:var(--serif)}

/* cards — רשומות בפנקס */
.list{display:grid;gap:.55rem;margin-top:.4rem}
details.card{background:var(--page);border:1px solid var(--line);border-radius:8px;position:relative;box-shadow:0 1px 0 var(--rule)}
details.card::before{content:"";position:absolute;inset-block:0;inset-inline-start:2.6rem;width:1px;background:var(--gold);opacity:.35}
details.card[open]{border-color:var(--gold);box-shadow:0 8px 24px -18px rgba(90,70,20,.5)}
details.card>summary{list-style:none;cursor:pointer;padding:.75rem 1rem .75rem .9rem;display:grid;grid-template-columns:auto 1fr auto;gap:.6rem .9rem;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
.card .t{font-family:var(--serif);font-weight:500;font-size:1.12rem;min-width:0;line-height:1.25}
.card .t small{display:block;font-family:var(--font);font-weight:400;color:var(--muted);font-size:.78rem;margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
.caret{width:.55rem;height:.55rem;background:var(--gold);transform:rotate(45deg);transition:transform .15s;margin-inline-end:.3rem;flex:none}
details[open]>summary .caret{transform:rotate(45deg) scale(1.35);background:var(--gold-2)}
.pill{font-size:.7rem;padding:.08rem .55rem;border-radius:999px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"◆";font-size:.55rem;margin-inline-end:.3rem;vertical-align:.1em}
.pill.active{background:var(--ok-soft);color:var(--ok)}
.pill.paused{background:var(--warn-soft);color:var(--warn)}
.pill.blocked{background:var(--bad-soft);color:var(--bad)}
.pill.done{background:var(--page-2);color:var(--muted)}
.pill.office{background:var(--office-soft);color:var(--office)}
.pill.group{background:var(--blue-soft);color:var(--blue)}
.pill.personal{background:var(--page-2);color:var(--ink-2)}
.pill.date{color:var(--muted);font-family:var(--serif);font-variant-numeric:tabular-nums}.pill.date::before{content:none}
.body{padding:0 1rem 1rem 1rem;border-top:1px dashed var(--line)}
.body h4{margin:1rem 0 .3rem;font-family:var(--serif);font-size:.95rem;color:var(--gold);font-weight:500;letter-spacing:.02em}
.body h4::after{content:"";display:block;height:1px;background:linear-gradient(to left,var(--gold),transparent);opacity:.5;margin-top:.15rem}
.body p{margin:.2rem 0;color:var(--ink-2)}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:.25rem}
.tasks li{display:flex;gap:.5rem;align-items:flex-start}
.tasks input{margin-top:.4rem;accent-color:var(--gold)}
.tasks li.off .tx{color:var(--muted);text-decoration:line-through}
.tasks .tx.office::before{content:"משרד";font-size:.65rem;background:var(--office-soft);color:var(--office);border-radius:4px;padding:0 .35rem;margin-inline-end:.4rem;vertical-align:middle}
.links{display:flex;flex-wrap:wrap;gap:.35rem}
.links a,.links span.f{border:1px solid var(--line);background:var(--page);border-radius:6px;padding:.22rem .6rem;font-size:.82rem;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links a{border-color:var(--gold-2)}
.links span.f{color:var(--ink-2);direction:ltr;unicode-bidi:plaintext;font-family:ui-monospace,monospace;font-size:.74rem}
details.sub{margin-top:.4rem}
details.sub>summary{cursor:pointer;color:var(--blue);font-size:.9rem;padding:.3rem 0}
.changes{margin:0;padding-inline-start:1rem;color:var(--ink-2);font-size:.9rem}
.changes li b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;font-family:var(--serif)}

/* thoughts box — פתק בשוליים */
.think{margin-top:1rem;background:var(--gold-soft);border-radius:6px;padding:.8rem;border:1px solid var(--gold-2);position:relative}
.think::before{content:"✎";position:absolute;top:.4rem;left:.7rem;color:var(--gold);font-size:1.1rem}
.think label{font-size:.82rem;color:var(--ink-2);display:block;margin-bottom:.3rem;font-family:var(--serif)}
.think textarea{width:100%;min-height:72px;resize:vertical;background:var(--page)}
.think .row{display:flex;gap:.5rem;align-items:center;margin-top:.4rem;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--page);border:0;border-radius:6px;padding:.42rem 1rem;font-weight:500}
.btn:hover{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.done{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.done:hover{background:var(--page-2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:.8rem;color:var(--muted)}
.note.ok{color:var(--ok)}
.note.bad{color:var(--bad)}

/* agents tree */
.tree details{border-inline-start:1px solid var(--gold);margin-inline-start:.5rem;padding-inline-start:.9rem;margin-top:.4rem}
.tree details>summary{cursor:pointer;list-style:none;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.3rem 0}
.tree details>summary::-webkit-details-marker{display:none}
.tree details>summary b{font-family:var(--serif);font-weight:500;font-size:1.02rem}
.tree .what{color:var(--ink-2);font-size:.9rem;margin:.1rem 0 .4rem}
.tree .kv{font-size:.8rem;color:var(--muted);display:flex;gap:1rem;flex-wrap:wrap}
.pill.working{background:var(--ok-soft);color:var(--ok)}.pill.broken{background:var(--bad-soft);color:var(--bad)}.pill.partial{background:var(--warn-soft);color:var(--warn)}.pill.dormant,.pill.unknown{background:var(--page-2);color:var(--muted)}
.pill.machine{background:var(--page-2);color:var(--ink-2)}.pill.machine::before{content:none}

/* flows */
.flow{display:grid;gap:.4rem;margin-top:.6rem}
.step{display:grid;grid-template-columns:2.4rem 1fr;gap:.6rem;background:var(--page);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem}
.step .n{font-family:var(--serif);font-size:1.6rem;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.step b{font-family:var(--serif);font-weight:500;font-size:1.02rem}
.step .who{font-size:.8rem;color:var(--muted);display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.15rem}
.step.manual{border-inline-start:4px solid var(--warn)}.step.auto{border-inline-start:4px solid var(--ok)}.step.broken{border-inline-start:4px solid var(--bad)}
.gate{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:.4rem .7rem;font-size:.85rem;margin-top:.3rem}
h4.sec{color:var(--gold);font-family:var(--serif);font-size:.95rem;font-weight:500;margin:1rem 0 .3rem}

/* skills */
.skills .cat{margin-top:.5rem}
.skills .cat>summary{cursor:pointer;list-style:none;display:flex;gap:.6rem;align-items:center;padding:.55rem .8rem;background:var(--page);border:1px solid var(--line);border-radius:8px;font-family:var(--serif);font-weight:500;font-size:1.05rem}
.skills .cat[open]>summary{border-color:var(--gold)}
.skills .cat>summary::-webkit-details-marker{display:none}
.skills table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:.3rem}
.skills th{text-align:right;font-size:.7rem;letter-spacing:.1em;color:var(--gold);padding:.4rem .5rem;border-bottom:1px solid var(--gold-2);font-weight:500}
.skills td{padding:.45rem .5rem;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
.skills td b{color:var(--ink);font-weight:500}
.skills code{font-size:.78rem;background:var(--page-2);padding:.05rem .35rem;border-radius:4px;direction:ltr;unicode-bidi:embed}
.tbl{overflow-x:auto}

/* sites */
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.5rem;margin-top:.4rem}
.sites a{display:block;background:var(--page);border:1px solid var(--line);border-radius:8px;padding:.55rem .8rem;color:var(--ink);min-width:0;font-family:var(--serif)}
.sites a:hover{border-color:var(--gold);text-decoration:none}
.sites a small{display:block;color:var(--muted);font-size:.72rem;direction:ltr;unicode-bidi:plaintext;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font)}

/* thoughts list */
.tlist{display:grid;gap:.4rem;margin-top:.6rem}
.titem{background:var(--gold-soft);border:1px solid var(--gold-2);border-radius:6px;padding:.6rem .8rem}
.titem .h{display:flex;gap:.6rem;align-items:center;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.titem .h b{font-family:var(--serif);color:var(--ink);font-weight:500;font-size:.95rem}
.titem p{margin:.3rem 0 0;white-space:pre-wrap}
.empty{color:var(--muted);padding:2rem 0;text-align:center;font-family:var(--serif);font-size:1.05rem}
.banner{background:var(--office-soft);color:var(--office);border-radius:6px;padding:.5rem .9rem;font-size:.88rem;margin-top:.3rem}
@media (prefers-reduced-motion: reduce){.caret{transition:none}}
@media (max-width:600px){details.card>summary{grid-template-columns:auto 1fr}.card .meta{grid-column:1/-1;justify-content:flex-start}header.top h1{font-size:1.9rem}#view{padding-inline:.6rem}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <h1>המחברת</h1>
    <div class="sub"><span id="today"></span><span id="dbstate">מתחבר לאחסון…</span><span id="loadstate"></span></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="view"></div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GROUPS={remnant:'REMNANT','diana-rafael':'דיאנה רפאל',customizeai:'CustomizeAI',trading:'מניות',projects:'פרויקטים',personal:'אישי',infra:'תשתית'};
const STATUS={active:'פעיל',paused:'מושהה',blocked:'חסום',done:'סיימנו'};
const TABS=[['topics','נושאים'],['done','סיימנו'],['agents','סוכנים'],['flows','פלואים'],['skills','סקילים'],['sites','אתרים וקבצים'],['thoughts','מחשבות שנשלחו']];
const state={tab:'topics',q:'',group:null,kind:null,status:null,office:false,data:{chapters:[],skills:{categories:[]},agents:{tree:[],flows:{}},extras:{}},db:null,chapterDocs:{},thoughts:[],open:{}};
try{const s=JSON.parse(localStorage.getItem('nb-ui')||'{}');Object.assign(state,{tab:s.tab||'topics',group:s.group||null,kind:s.kind||null,status:s.status||null});}catch(e){}
function saveUI(){try{localStorage.setItem('nb-ui',JSON.stringify({tab:state.tab,group:state.group,kind:state.kind,status:state.status}))}catch(e){}}
$('#today').textContent=new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

/* ---------- data ---------- */
async function loadJSON(p){try{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch(e){return null}}
async function loadData(){
  const [c,s,a,x]=await Promise.all([loadJSON('data/chapters.json'),loadJSON('data/skills.json'),loadJSON('data/agents.json'),loadJSON('data/extras.json')]);
  if(c)state.data.chapters=c; if(s)state.data.skills=s; if(a)state.data.agents=a; if(x)state.data.extras=x;
  $('#loadstate').textContent=`${state.data.chapters.length} נושאים · עודכן ${state.data.extras.generated||''}`;
  render();
}
/* ---------- db ---------- */
async function initDB(){
  const db=await window.claude?.use?.('db').catch(()=>null);
  if(!db){$('#dbstate').textContent='ללא אחסון (קריאה בלבד)';return}
  state.db=db;$('#dbstate').textContent='אחסון מחובר';
  db.collection('chapters').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});state.chapterDocs=m;if(state.tab==='topics'||state.tab==='done')render()},e=>{$('#dbstate').textContent='אחסון: '+e.code});
  db.collection('thoughts').orderBy('ts','desc').limit(200).onSnapshot(snap=>{state.thoughts=snap.docs.map(d=>({id:d.id,...d.data()}));if(state.tab==='thoughts')render();updateTabCounts()},()=>{});
}
async function setChapter(id,patch){
  if(!state.db)return false;
  const ref=state.db.doc('chapters/'+id);const cur=state.chapterDocs[id]||{};
  try{await ref.set({...cur,...patch,updated:new Date().toISOString()});return true}catch(e){return false}
}
async function sendThought(id,title,text){
  if(!state.db)return false;
  try{await state.db.collection('thoughts').add({chapter:id,chapterTitle:title,text,ts:new Date().toISOString(),handled:false});return true}catch(e){return false}
}
/* ---------- render ---------- */
function updateTabCounts(){
  const ch=state.data.chapters;const done=ch.filter(c=>isDone(c)).length;const pend=state.thoughts.filter(t=>!t.handled).length;
  const counts={topics:ch.length-done,done,agents:countTree(state.data.agents.tree||[]),flows:Object.keys(state.data.agents.flows||{}).length,skills:(state.data.skills.categories||[]).reduce((n,c)=>n+(c.items||[]).length,0),sites:(state.data.extras.live_sites||[]).length,thoughts:pend};
  $('#tabs').innerHTML=TABS.map(([id,l])=>`<button role="tab" aria-selected="${state.tab===id}" data-tab="${id}">${l}<span class="n">${counts[id]??''}</span></button>`).join('');
}
function countTree(t){return t.reduce((n,x)=>n+1+countTree(x.children||[]),0)}
function isDone(c){const d=state.chapterDocs[c.id];return d&&typeof d.done==='boolean'?d.done:c.status==='done'}
function render(){updateTabCounts();const v=$('#view');
  ({topics:renderTopics,done:renderTopics,agents:renderAgents,flows:renderFlows,skills:renderSkills,sites:renderSites,thoughts:renderThoughts})[state.tab](v);}
function pill(cls,txt){return `<span class="pill ${cls}">${h(txt)}</span>`}

function renderTopics(v){
  const doneTab=state.tab==='done';
  let list=state.data.chapters.filter(c=>isDone(c)===doneTab);
  const q=state.q.trim();
  if(state.group)list=list.filter(c=>c.group===state.group);
  if(state.kind)list=list.filter(c=>c.kind===state.kind);
  if(state.status&&!doneTab)list=list.filter(c=>c.status===state.status);
  if(state.office)list=list.filter(c=>c.office_only);
  if(q)list=list.filter(c=>JSON.stringify(c).includes(q));
  list.sort((a,b)=>(b.last_update||'').localeCompare(a.last_update||''));
  const officeN=state.data.chapters.filter(c=>c.office_only&&!isDone(c)).length;
  v.innerHTML=`
  <div class="filters">
    <input type="search" id="q" placeholder="חיפוש בכל הנושאים…" value="${h(state.q)}">
    <div class="chips">${Object.entries(GROUPS).map(([k,l])=>`<button class="chip" data-f="group" data-v="${k}" aria-pressed="${state.group===k}">${l}</button>`).join('')}</div>
    <div class="chips">${['business','personal'].map(k=>`<button class="chip" data-f="kind" data-v="${k}" aria-pressed="${state.kind===k}">${k==='business'?'עסקי':'אישי'}</button>`).join('')}
    ${doneTab?'':['active','paused','blocked'].map(k=>`<button class="chip" data-f="status" data-v="${k}" aria-pressed="${state.status===k}">${STATUS[k]}</button>`).join('')}
    <button class="chip" data-f="office" aria-pressed="${state.office}">רק מהמשרד</button></div>
    <span class="count">${list.length} נושאים</span>
  </div>
  ${(!doneTab&&officeN&&!state.office)?`<div class="banner">${officeN} נושאים מעודכנים רק במחשב המשרד — מחר בפתיחת יום משם נשלים אותם.</div>`:''}
  <div class="list">${list.length?list.map(card).join(''):'<div class="empty">אין נושאים שתואמים לסינון</div>'}</div>`;
  wireFilters(v);
  v.querySelectorAll('details.card').forEach(d=>{d.addEventListener('toggle',()=>{state.open[d.dataset.id]=d.open})});
  v.querySelectorAll('[data-act=send]').forEach(b=>b.addEventListener('click',onSend));
  v.querySelectorAll('[data-act=done]').forEach(b=>b.addEventListener('click',onDone));
  v.querySelectorAll('.tasks input').forEach(i=>i.addEventListener('change',onTask));
}
function card(c){
  const doc=state.chapterDocs[c.id]||{};const checks=doc.tasks||{};const done=isDone(c);
  const tasks=(c.next_tasks||[]).map((t,i)=>{const off=t.startsWith('משרד:');const txt=off?t.replace(/^משרד:\s*/,''):t;return `<li class="${checks[i]?'off':''}"><input type="checkbox" id="t-${c.id}-${i}" data-ch="${c.id}" data-i="${i}" ${checks[i]?'checked':''} ${state.db?'':'disabled'}><label for="t-${c.id}-${i}" class="tx ${off?'office':''}">${h(txt)}</label></li>`}).join('');
  const arts=(c.artifacts||[]).map(a=>a.url&&/^https?:/.test(a.url)?`<a href="${h(a.url)}" target="_blank" rel="noopener" title="${h(a.url)}">${h(a.label||a.url)}</a>`:`<span class="f" title="${h(a.url||'')}">${h(a.label||'')}${a.url?' · '+h(a.url.replace(/^file:\s*/,'')):''}</span>`).join('');
  const changes=(c.recent_changes||[]).map(x=>`<li>${h(x).replace(/^(\d{1,2}\.\d{1,2}(\.\d{2,4})?|\d{4}-\d{2}-\d{2})/,'<b>$1</b>')}</li>`).join('');
  return `<details class="card" data-id="${h(c.id)}" ${state.open[c.id]?'open':''}>
    <summary><span class="caret"></span><div class="t">${h(c.title)}<small>${h((c.where_we_stand||'').split(/[.。\n]/)[0])}</small></div>
      <div class="meta">${c.office_only?pill('office','משרד'):''}${pill('group',GROUPS[c.group]||c.group)}${c.kind==='personal'?pill('personal','אישי'):''}${pill(done?'done':c.status,done?'סיימנו':STATUS[c.status]||c.status)}<span class="pill date">${h(c.last_update||'')}</span></div></summary>
    <div class="body">
      <h4>איפה אנחנו עומדים</h4><p>${h(c.where_we_stand)}</p>
      ${tasks?`<h4>המשימות לפנינו</h4><ul class="tasks">${tasks}</ul>`:''}
      ${changes?`<details class="sub"><summary>שינויים אחרונים (${c.recent_changes.length})</summary><ol class="changes">${changes}</ol></details>`:''}
      ${arts?`<h4>ארטיפקטים</h4><div class="links">${arts}</div>`:''}
      <div class="think"><label for="th-${c.id}">מחשבה / הנחיה על הנושא הזה — נשלחת אליי ואני מסדר</label>
        <textarea id="th-${c.id}" placeholder="כתוב כאן…" ${state.db?'':'disabled'}></textarea>
        <div class="row"><button class="btn" data-act="send" data-ch="${h(c.id)}" data-title="${h(c.title)}" ${state.db?'':'disabled'}>שלח לקלוד</button>
        <button class="btn done" data-act="done" data-ch="${h(c.id)}" ${state.db?'':'disabled'}>${done?'החזר לפעיל':'סיימנו עם זה ✓'}</button>
        <span class="note" id="n-${c.id}">${state.db?'':'אין חיבור לאחסון — פתח את העמוד דרך claude.ai'}</span></div></div>
      ${c.sources?.length?`<p class="note" style="margin-top:.6rem">מקורות: ${h(c.sources.join(' · '))}</p>`:''}
    </div></details>`;
}
function wireFilters(v){
  const q=v.querySelector('#q');if(q){q.addEventListener('input',e=>{state.q=e.target.value;renderKeepFocus()})}
  v.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{const f=b.dataset.f;if(f==='office'){state.office=!state.office}else{state[f]=state[f]===b.dataset.v?null:b.dataset.v}saveUI();render()}));
}
function renderKeepFocus(){const pos=$('#q')?.selectionStart;render();const q=$('#q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}}
async function onSend(e){const b=e.currentTarget;const id=b.dataset.ch;const ta=$('#th-'+CSS.escape(id));const n=$('#n-'+CSS.escape(id));const text=(ta.value||'').trim();if(!text){n.textContent='כתוב משהו קודם';n.className='note bad';return}
  b.disabled=true;n.textContent='שולח…';n.className='note';const ok=await sendThought(id,b.dataset.title,text);b.disabled=false;
  if(ok){ta.value='';n.textContent='נשלח. אקרא את זה בפתיחת היום הבאה.';n.className='note ok'}else{n.textContent='השליחה נכשלה — נסה שוב';n.className='note bad'}}
async function onDone(e){const id=e.currentTarget.dataset.ch;const c=state.data.chapters.find(x=>x.id===id);const cur=isDone(c);e.currentTarget.disabled=true;await setChapter(id,{done:!cur,done_ts:new Date().toISOString()});}
async function onTask(e){const i=e.target;const id=i.dataset.ch;const cur=state.chapterDocs[id]||{};const tasks={...(cur.tasks||{})};tasks[i.dataset.i]=i.checked;i.closest('li').classList.toggle('off',i.checked);await setChapter(id,{tasks});}

/* ---------- agents ---------- */
function renderAgents(v){const t=state.data.agents.tree||[];
  v.innerHTML=`<div class="filters"><span class="note">היררכיה לפי טריגר: מתוזמן · מונחה-אירוע · לפי דרישה · שירותים חיצוניים. לחץ לפתיחה.</span></div><div class="tree">${t.length?t.map(node).join(''):'<div class="empty">אין נתוני סוכנים עדיין</div>'}</div>`;}
function node(n,depth=0){const kids=(n.children||[]).map(c=>node(c,depth+1)).join('');
  return `<details ${depth===0?'open':''}><summary><b>${h(n.title)}</b>${n.status?pill(n.status,{working:'עובד',broken:'שבור',partial:'חלקי',dormant:'רדום',unknown:'לא ידוע'}[n.status]||n.status):''}${n.machine?pill('machine',{home:'בית',office:'משרד',cloud:'ענן',make:'Make',both:'שני המחשבים'}[n.machine]||n.machine):''}${n.schedule?`<span class="note">${h(n.schedule)}</span>`:''}</summary>
  ${n.what?`<div class="what">${h(n.what)}</div>`:''}<div class="kv">${n.io?`<span>${h(n.io)}</span>`:''}${n.last_run?`<span>ריצה אחרונה: ${h(n.last_run)}</span>`:''}${n.known_issues?`<span style="color:var(--bad)">${h(n.known_issues)}</span>`:''}</div>
  ${(n.files||[]).length?`<div class="links" style="margin-top:.3rem">${n.files.map(f=>/^https?:/.test(f)?`<a href="${h(f)}" target="_blank" rel="noopener">${h(f.replace(/^https?:\/\//,'').slice(0,50))}</a>`:`<span class="f">${h(f)}</span>`).join('')}</div>`:''}${kids}</details>`}

/* ---------- flows ---------- */
function renderFlows(v){const fl=state.data.agents.flows||{};const keys=Object.keys(fl);
  if(!keys.length){v.innerHTML='<div class="empty">אין פלואים עדיין</div>';return}
  v.innerHTML=`<div class="filters"><div class="chips">${keys.map(k=>`<button class="chip" data-flow="${h(k)}" aria-pressed="${(state.flow||keys[0])===k}">${h(fl[k].title||k)}</button>`).join('')}</div></div><div id="flowbody"></div>`;
  const draw=k=>{const f=fl[k];state.flow=k;$('#flowbody').innerHTML=`<div class="flow">${(f.steps||[]).map(s=>`<div class="step ${h(s.status||'')}"><div class="n">${h(s.n)}</div><div><b>${h(s.title)}</b><div class="who">${s.who?`<span>מי: ${h(s.who)}</span>`:''}${s.tool?`<span>כלי: <code>${h(s.tool)}</code></span>`:''}${s.status?`<span>${{auto:'אוטומטי',manual:'ידני',broken:'שבור'}[s.status]||h(s.status)}</span>`:''}</div>${s.notes?`<div class="note" style="margin-top:.2rem">${h(s.notes)}</div>`:''}</div></div>`).join('')}</div>
    ${(f.approval_gates||[]).length?`<h4 class="sec">שערי אישור</h4>${f.approval_gates.map(g=>`<div class="gate">${h(g)}</div>`).join('')}`:''}
    ${(f.open_improvements||[]).length?`<details class="sub"><summary>שיפורים פתוחים (${f.open_improvements.length})</summary><ul class="changes">${f.open_improvements.map(x=>`<li>${h(x)}</li>`).join('')}</ul></details>`:''}`;
    v.querySelectorAll('[data-flow]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.flow===k))};
  v.querySelectorAll('[data-flow]').forEach(b=>b.addEventListener('click',()=>draw(b.dataset.flow)));draw(state.flow&&fl[state.flow]?state.flow:keys[0]);}

/* ---------- skills ---------- */
function renderSkills(v){const cats=state.data.skills.categories||[];const q=(state.sq||'').trim();
  v.innerHTML=`<div class="filters"><input type="search" id="sq" placeholder="חיפוש סקיל…" value="${h(state.sq||'')}"><div class="chips">${['user','project','plugin:adobe','plugin:ponytail','bundled','harness','mcp'].map(o=>`<button class="chip" data-o="${o}" aria-pressed="${state.so===o}">${o}</button>`).join('')}</div></div>
  <div class="skills">${cats.map(c=>{let items=c.items||[];if(state.so)items=items.filter(i=>i.origin===state.so);if(q)items=items.filter(i=>JSON.stringify(i).includes(q));if(!items.length)return '';
    return `<details class="cat" ${q||state.so?'open':''}><summary><span>${h(c.icon||'')}</span><span>${h(c.title)}</span><span class="note">${items.length}</span></summary><div class="tbl"><table><tr><th>סקיל</th><th>מה עושה</th><th>איך מפעילים</th><th>מקור</th><th>מצב</th></tr>${items.map(i=>`<tr><td><b>${h(i.name)}</b></td><td>${h(i.title)}${i.notes?`<div class="note">${h(i.notes)}</div>`:''}</td><td><code>${h(i.trigger||'')}</code></td><td>${h(i.origin||'')}</td><td>${i.status?pill(i.status,{working:'עובד',partial:'חלקי',broken:'שבור',unknown:'?'}[i.status]||i.status):''}</td></tr>`).join('')}</table></div></details>`}).join('')||'<div class="empty">אין סקילים עדיין</div>'}</div>`;
  const sq=v.querySelector('#sq');sq.addEventListener('input',e=>{state.sq=e.target.value;const p=e.target.selectionStart;render();const n=$('#sq');n.focus();try{n.setSelectionRange(p,p)}catch(x){}});
  v.querySelectorAll('[data-o]').forEach(b=>b.addEventListener('click',()=>{state.so=state.so===b.dataset.o?null:b.dataset.o;render()}));}

/* ---------- sites ---------- */
function renderSites(v){const s=state.data.extras.live_sites||[];const by={};s.forEach(x=>{(by[x.topic||'אחר']=by[x.topic||'אחר']||[]).push(x)});
  v.innerHTML=Object.entries(by).map(([t,arr])=>`<h4 class="sec">${h(t)}</h4><div class="sites">${arr.map(x=>`<a href="${h(x.url)}" target="_blank" rel="noopener">${h(x.label)}<small>${h(x.url)}</small></a>`).join('')}</div>`).join('')||'<div class="empty">אין קישורים עדיין</div>';}

/* ---------- thoughts ---------- */
function renderThoughts(v){const t=state.thoughts;
  v.innerHTML=`<div class="filters"><span class="note">כל מה ששלחת מהבוקסים. "טופל" מסומן על ידי כשקראתי וסידרתי.</span></div><div class="tlist">${t.length?t.map(x=>`<div class="titem"><div class="h"><b>${h(x.chapterTitle||x.chapter)}</b><span>${h(new Date(x.ts).toLocaleString('he-IL'))}</span>${x.handled?pill('working','טופל'):pill('partial','ממתין')}</div><p>${h(x.text)}</p>${x.reply?`<p class="note">תשובה: ${h(x.reply)}</p>`:''}</div>`).join(''):'<div class="empty">עוד לא נשלחו מחשבות</div>'}</div>`;}

/* ---------- tabs ---------- */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;saveUI();render();window.scrollTo({top:0})});
const hash=location.hash.replace('#','');if(TABS.some(t=>t[0]===hash))state.tab=hash;
render();loadData();initDB();
})();
</script>
